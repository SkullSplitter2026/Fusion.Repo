<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
<title>Anmeldung · Kodi Android Web File Explorer</title>

<!-- Web App & Icons -->
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Crect width='100' height='100' fill='%234e8bb0'/%3E%3Ctext x='50' y='75' font-size='60' text-anchor='middle' fill='white' font-family='monospace'%3E📁%3C/text%3E%3C/svg%3E" />
<link rel="apple-touch-icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Crect width='100' height='100' fill='%234e8bb0'/%3E%3Ctext x='50' y='75' font-size='60' text-anchor='middle' fill='white' font-family='monospace'%3E📁%3C/text%3E%3C/svg%3E" />
<meta name="theme-color" content="#4e8bb0" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
<meta name="apple-mobile-web-app-title" content="Kodi Explorer" />

<style>
* {
  box-sizing: border-box;
  margin: 0;
  padding: 0;
}

body {
  background: linear-gradient(145deg, #7fc1e8 0%, #4e8bb0 100%);
  font-family: system-ui, -apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', sans-serif;
  min-height: 100vh;
  display: flex;
  align-items: center;
  justify-content: center;
  padding: 1rem;
  padding-bottom: env(safe-area-inset-bottom);
}

.login-container {
  width: 100%;
  max-width: 460px;
  animation: fadeUp 0.5s ease-out;
}

@keyframes fadeUp {
  from {
    opacity: 0;
    transform: translateY(20px);
  }
  to {
    opacity: 1;
    transform: translateY(0);
  }
}

.card {
  background: #ffffff;
  border-radius: 32px;
  box-shadow: 0 20px 35px -12px rgba(0, 0, 0, 0.2);
  padding: 2rem 1.8rem;
  transition: box-shadow 0.2s;
}

.logo {
  text-align: center;
  margin-bottom: 1.5rem;
}

.logo-icon {
  font-size: 3.8rem;
  display: inline-block;
  filter: drop-shadow(0 4px 6px rgba(0, 0, 0, 0.1));
}

h1 {
  font-size: 1.9rem;
  font-weight: 700;
  margin: 0.5rem 0 0;
  color: #2c3e50;
  letter-spacing: -0.3px;
}

.sub {
  font-size: 0.85rem;
  color: #5d6e85;
  margin-top: 0.25rem;
  font-weight: 500;
}

label {
  display: block;
  font-size: 0.8rem;
  font-weight: 600;
  margin: 1.2rem 0 0.5rem;
  color: #2c3e50;
  letter-spacing: 0.3px;
  text-transform: uppercase;
}

input[type="text"],
input[type="password"] {
  width: 100%;
  padding: 0.9rem 1.2rem;
  border-radius: 40px;
  border: 1px solid #cbd5e1;
  font-size: 1rem;
  background: #fefcf9;
  transition: all 0.2s;
  -webkit-appearance: none;
}

input:focus {
  border-color: #4e8bb0;
  background: #ffffff;
  outline: none;
  box-shadow: 0 0 0 3px rgba(78, 139, 176, 0.2);
}

.btn {
  margin-top: 2rem;
  width: 100%;
  padding: 0.9rem;
  border-radius: 40px;
  border: none;
  background: #4e8bb0;
  color: white;
  font-size: 1rem;
  font-weight: 600;
  cursor: pointer;
  transition: transform 0.15s, box-shadow 0.15s;
  box-shadow: 0 6px 14px rgba(78, 139, 176, 0.3);
}

.btn:hover {
  transform: translateY(-2px);
  box-shadow: 0 10px 20px rgba(78, 139, 176, 0.35);
}

.btn:active {
  transform: translateY(1px);
}

.btn-danger {
  background: #e05a5a;
  box-shadow: 0 6px 14px rgba(224, 90, 90, 0.3);
}

.btn-danger:hover {
  background: #c0392b;
  box-shadow: 0 10px 20px rgba(192, 57, 43, 0.35);
}

.info {
  font-size: 0.75rem;
  color: #5d6e85;
  margin-top: 1.2rem;
  text-align: center;
  line-height: 1.4;
}

.err {
  color: #c0392b;
  font-size: 0.85rem;
  margin: 0.8rem 0;
  font-weight: 500;
  background: #fbe9e7;
  padding: 0.7rem;
  border-radius: 40px;
  text-align: center;
}

.footer {
  margin-top: 1.2rem;
  text-align: center;
  font-size: 0.7rem;
  color: #eef4ff;
  display: flex;
  justify-content: center;
  gap: 1rem;
  flex-wrap: wrap;
  padding-bottom: env(safe-area-inset-bottom);
}

.footer span {
  letter-spacing: 0.5px;
}

.footer a {
  color: #eef4ff;
  text-decoration: none;
  border-bottom: 1px dotted rgba(255,255,255,0.6);
}

.footer a:hover {
  color: #ffffff;
  border-bottom-color: #ffffff;
}

@media (max-width: 480px) {
  .card {
    padding: 1.5rem 1.2rem;
  }
  input,
  .btn {
    padding: 0.8rem 1rem;
  }
  .logo-icon {
    font-size: 3rem;
  }
}
</style>
</head>
<body>
<div class="login-container">
  <form class="card" method="POST" action="" autocomplete="on" id="loginForm">
    <div class="logo">
      <div class="logo-icon">📁</div>
      <h1>Kodi Explorer</h1>
      <div class="sub">Android Web File Explorer</div>
    </div>

    <div id="err" class="err" style="display:none;">Anmeldung fehlgeschlagen</div>

    <label for="username">Benutzername</label>
    <input id="username" name="username" type="text" autocomplete="username" required />

    <label for="password">Passwort</label>
    <input id="password" name="password" type="password" autocomplete="current-password" required />

    <button class="btn" type="submit">Anmelden</button>
    <div class="info">Bitte Zugangsdaten eingeben.</div>
  </form>
  <div class="footer">
    <span>© 2026 André Albus</span>
    <span>·</span>
    <span>GPL-2.0-or-later</span>
  </div>
</div>

<script>
(function(){
  try{
    const params = new URLSearchParams(location.search || '');
    const next = params.get('next') || '';
    const err = params.get('err');

    const form = document.getElementById('loginForm');
    const errBox = document.getElementById('err');

    if(err === '1'){
      errBox.style.display = 'block';
    }

    form.action = '/login' + (next ? ('?next=' + encodeURIComponent(next)) : '');
  }catch(e){
    console.error('Login init error:', e);
  }
})();
</script>
</body>
</html>
